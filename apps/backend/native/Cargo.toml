[package]
name = "corptie-native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", features = ["napi8"] }
napi-derive = "2"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
# Rust 1.96's Mach-O stripper can leave LC_SYMTAB.stroff misaligned,
# causing dyld to reject this Node addon on macOS 27 (rust-lang/rust#157750).
# Keep linker-produced alignment; LTO and release optimizations remain enabled.
strip = "none"
