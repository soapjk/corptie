name: CorptieMobile
options:
  deploymentTarget:
    iOS: '17.0'
packages:
  CorptieConversation:
    path: ../../packages/CorptieConversation
  CorptieClientCore:
    path: ../../packages/CorptieClientCore
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    SUPPORTS_MACCATALYST: NO
    DEVELOPMENT_TEAM: RUT4Z5DWDP
    CODE_SIGN_STYLE: Automatic
targets:
  CorptieMobile:
    type: application
    platform: iOS
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Corptie
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: '1'
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.corptie.oauth
            CFBundleURLSchemes: [corptie]
        NSLocalNetworkUsageDescription: 连接你指定的 Mac，浏览并操作 Corptie 会话。
        NSCameraUsageDescription: 扫描 Mac 上的 Corptie 配对二维码，自动填写连接信息并申请配对。
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    sources: [Sources]
    dependencies:
      - package: CorptieConversation
        product: CorptieConversation
      - package: CorptieClientCore
        product: CorptieClientCore
      - package: CorptieClientCore
        product: CorptieClientSecurity
    settings:
      base:
        PRODUCT_NAME: CorptieMobile
        PRODUCT_BUNDLE_IDENTIFIER: com.corptie.ipad.development
  CorptieMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: CorptieMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.corptie.ipad.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: CorptieMobile
schemes:
  CorptieMobile:
    build:
      targets:
        CorptieMobile: all
    test:
      targets: [CorptieMobileUITests]
