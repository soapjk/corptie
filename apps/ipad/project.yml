name: CorptiePad
options:
  deploymentTarget:
    iOS: '17.0'
packages:
  CorptieClientCore:
    path: ../../packages/CorptieClientCore
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    SUPPORTS_MACCATALYST: NO
targets:
  CorptiePad:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: CorptieClientCore
        product: CorptieClientCore
      - package: CorptieClientCore
        product: CorptieClientSecurity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.corptie.ipad.development
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Corptie
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: 连接你指定的 Mac，浏览并操作 Corptie 会话。
        INFOPLIST_KEY_NSCameraUsageDescription: 扫描 Mac 上的 Corptie 配对二维码，自动填写连接信息并申请配对。
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  CorptiePadUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: CorptiePad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.corptie.ipad.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: CorptiePad
schemes:
  CorptiePad:
    build:
      targets:
        CorptiePad: all
    test:
      targets: [CorptiePadUITests]
